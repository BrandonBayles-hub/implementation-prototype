name: Update A2P campaign status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-a2p-campaign-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query Twilio
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python campaign-status/update_status.py

      - name: Validate complete cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("campaign-status/data.json").read_text())
          assert data["total"] == 575, f"Expected 575 campaigns, got {data['total']}"
          assert not data.get("scanErrors"), f"Twilio account scans failed: {data['scanErrors']}"
          assert sum(data["summary"].values()) == 575, "Status totals do not equal cohort"
          PY

      - name: Publish refreshed data
        run: |
          git config user.name "campaign-status-bot"
          git config user.email "campaign-status-bot@users.noreply.github.com"
          git add campaign-status/data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh A2P campaign status"
          git push
