name: Update A2P campaign status

on:
  # Offset minutes avoid GitHub's high-load */15 / :00 slots, which can delay or drop runs.
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-campaign-status]

permissions:
  contents: write

concurrency:
  group: update-a2p-campaign-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query Twilio
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python campaign-status/update_status.py

      - name: Validate complete cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("campaign-status/data.json").read_text())
          total = data["total"]
          original = data["originalPropertyCount"]
          added = data["oxpAddedPropertyCount"]
          remediation = data["remediationAddedPropertyCount"]

          # The cohort is the original submitted-property list, plus the properties pulled
          # in by the OXP client reconciliation, plus clients added for active remediation,
          # so the expected total is derived from the scan rather than hard-coded.
          assert original == 575, f"Original cohort should be 575 properties, got {original}"
          assert total == original + added + remediation, (
              f"total {total} != original {original} + OXP-added {added} + remediation {remediation}"
          )
          assert not data.get("scanErrors"), f"Twilio account scans failed: {data['scanErrors']}"
          assert sum(data["summary"].values()) == total, (
              f"Status totals {sum(data['summary'].values())} do not equal cohort {total}"
          )
          PY

      - name: Publish refreshed data
        run: |
          git config user.name "campaign-status-bot"
          git config user.email "campaign-status-bot@users.noreply.github.com"
          git add campaign-status/data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh A2P campaign status"
          git push
