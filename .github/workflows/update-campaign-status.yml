name: Update A2P campaign status

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-a2p-campaign-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query Twilio
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python campaign-status/update_status.py

      - name: Publish refreshed data
        run: |
          git config user.name "campaign-status-bot"
          git config user.email "campaign-status-bot@users.noreply.github.com"
          git add campaign-status/data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh A2P campaign status"
          git push
